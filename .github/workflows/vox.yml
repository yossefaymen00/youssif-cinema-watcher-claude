name: VOX watcher

on:
  schedule:
    # كل 5 دقايق على دقايق "فردية" (مش 0/5/10...) لأن GitHub بيزحم ويتخطى التشغيلات عند الدقايق الرقيقة
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "اختبار تليجرام بس (يبعت رسالة تجربة)"
        type: boolean
        default: false
      debug:
        description: "احفظ ملفات debug (HTML + صور + JSON) للفحص"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: vox-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Test Telegram
        if: ${{ inputs.test_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python vox_watcher.py --test-telegram

      - name: Diagnose connection to VOX
        if: ${{ inputs.debug && !inputs.test_telegram }}
        continue-on-error: true
        run: python vox_watcher.py --diagnose

      - name: Cache Playwright browser
        if: ${{ !inputs.test_telegram }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium
        if: ${{ !inputs.test_telegram }}
        run: python -m playwright install --with-deps chromium

      - name: Run watcher
        if: ${{ !inputs.test_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEBUG: ${{ inputs.debug && '1' || '0' }}
        run: python vox_watcher.py

      - name: Upload debug files
        if: ${{ always() && !inputs.test_telegram }}
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      - name: Save state
        if: ${{ always() && !inputs.test_telegram }}
        run: |
          git config user.name "vox-watcher"
          git config user.email "vox-watcher@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "update state"
            git pull --rebase --autostash || true
            git push
          fi
